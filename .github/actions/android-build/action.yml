name: Android build
description: >-
  Shared build steps of ci.yml, preview.yml and release.yml: JDK 17, RawlineCore AAR + sing-box schema, routeprofiles
  snapshot, sing-box dashboard, Gradle, then ./gradlew <tasks>. With sign=true, release builds are signed with the
  SIGNING_* secrets from the job environment; the build fails without them.
inputs:
  tasks:
    description: Gradle tasks to run
    required: true
  channel:
    description: stable or preview (BuildConfig.PREVIEW, versionName suffix -pre.<build-number>)
    required: false
    default: stable
  build-number:
    description: last three digits of versionCode (999 stable tag build, commits since the last stable tag for previews)
    required: false
    default: '0'
  sign:
    description: sign release builds (true/false)
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify and stage native transports
      shell: bash
      run: python3 scripts/stage_native_transports.py
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: RawlineCore AAR and schema
      uses: ./.github/actions/rawline-core
    - name: Install Go for native transports
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: false
    - name: Cache qWDTT 1.4.5 clients
      id: qwdtt-cache
      uses: actions/cache@v6
      with:
        path: deployment/qwdtt145
        key: qwdtt145-${{ hashFiles('nb4a.properties', 'scripts/build_qwdtt145.sh', 'scripts/prepare_qwdtt145.py', 'scripts/prepare_csqtt_compat_bridge.py', 'core-patches/carrier-socks/qwdtt/*.go', 'carriers/mrtt/mrtt_io_mobile.go') }}
    - name: Build qWDTT 1.4.5 clients from pinned source
      if: steps.qwdtt-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash scripts/build_qwdtt145.sh
    - name: Stage qWDTT 1.4.5 clients
      shell: bash
      run: |
        for ABI in arm64-v8a armeabi-v7a x86_64; do
          test -s "deployment/qwdtt145/$ABI/libqwdtt.so"
          cp "deployment/qwdtt145/$ABI/libqwdtt.so" "deployment/carriers/$ABI/libqwdtt.so"
          cp "deployment/qwdtt145/$ABI/SOURCES.txt" "app/src/main/assets/carrier-licenses/$ABI/qWDTT-1.4.5-SOURCES.txt"
        done
    - name: Cache FreeTurn clients
      id: freeturn-cache
      uses: actions/cache@v6
      with:
        path: deployment/freeturn
        key: freeturn-ndk28-${{ hashFiles('scripts/build_freeturn.sh', 'carriers/freeturn/*.go') }}
    - name: Build FreeTurn clients from pinned source
      if: steps.freeturn-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
        for ABI in arm64-v8a armeabi-v7a x86_64; do bash scripts/build_freeturn.sh "$ABI"; done
    - name: Stage FreeTurn clients
      shell: bash
      run: |
        for ABI in arm64-v8a armeabi-v7a x86_64; do
          source="deployment/freeturn/$ABI"
          (cd "$source"; sha256sum -c SHA256SUMS)
          cp "$source/libfreeturn.so" "deployment/carriers/$ABI/"
          cp "$source/FreeTurn-LICENSE" "app/src/main/assets/carrier-licenses/$ABI/"
          cp "$source/SOURCES.txt" "app/src/main/assets/carrier-licenses/$ABI/FreeTurn-SOURCES.txt"
        done
    - name: Fetch routeprofiles snapshot
      uses: ./.github/actions/routeprofiles
    - name: Fetch sing-box dashboard
      uses: ./.github/actions/sing-box-dashboard
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
    - name: Gradle build
      shell: bash
      env:
        RAWLINE_CHANNEL: ${{ inputs.channel }}
        RAWLINE_BUILD: ${{ inputs.build-number }}
        RAWLINE_SIGN: ${{ inputs.sign }}
      run: |
        set -euo pipefail
        if [ "$RAWLINE_SIGN" = "true" ]; then
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ]; then
            : "${SIGNING_STORE_PASSWORD:?the SIGNING_STORE_PASSWORD secret is missing}"
            : "${SIGNING_KEY_ALIAS:?the SIGNING_KEY_ALIAS secret is missing}"
            KS="$RUNNER_TEMP/release-signing.keystore"
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode --ignore-garbage > "$KS"
            UPDATE_SIGNER_SHA256=$(keytool -exportcert -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
            rm -f "$KS"
            export UPDATE_SIGNER_SHA256
            echo "Signing with the release key from the repository secrets (certificate SHA-256 $UPDATE_SIGNER_SHA256)"
          else
            echo "::error::No signing key: add the SIGNING_* repository secrets"
            exit 1
          fi
        else
          unset SIGNING_KEYSTORE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
        fi
        # Room variants export the same schema file; never run their KSP workers together.
        for task in ${{ inputs.tasks }}; do
          ./gradlew --stacktrace "$task"
        done
