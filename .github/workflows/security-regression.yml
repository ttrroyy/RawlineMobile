name: Android security regression
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful CI build to test
        required: true
      system_tun:
        description: Test the explicit System TUN stack
        type: boolean
        default: false
      device:
        description: Select the emulator coverage
        type: choice
        default: phones
        options:
          - phones
          - android17
          - android-tv
permissions:
  contents: read
  actions: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.device == 'android17' && '["37.0"]' || inputs.device == 'android-tv' && '[36]' || '[29, 33, 35]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: RawlineMobile-debug
          path: tested-apk
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: RawlineMobile-security-tests
          path: test-apk
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Prepare emulator
        shell: bash
        env:
          SDK_API: ${{ matrix.api }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/security-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          image_tag=google_apis
          hardware=pixel_6
          if [[ "$DEVICE" == android-tv ]]; then
            image_tag=android-tv
            hardware=tv_1080p
          fi
          image="system-images;android-$SDK_API;$image_tag;x86_64"
          "$SDK/sdkmanager" "$image" 'emulator' 'platform-tools' >/dev/null
          "$SDK/avdmanager" create avd -n security-test -k "$image" --device "$hardware" --force
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd security-test -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 180 "$ADB" wait-for-device
          for attempt in $(seq 1 120); do
            if test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = 1; then break; fi
            sleep 2
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$ADB" shell input keyevent 82
          "$ADB" install -r "$(find tested-apk -name '*x86_64*.apk' -print -quit)"
          "$ADB" install -r "$(find test-apk -name '*.apk' -print -quit)"
          PACKAGE=$("$ADB" shell pm list packages | sed -n 's/^package:\(app.rawline.mobile[^[:space:]]*\)/\1/p' | grep -v '\.test$' | tr -d '\r')
          if [[ "${SDK_API%%.*}" -ge 33 ]]; then "$ADB" shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS; fi
          "$ADB" shell dumpsys deviceidle whitelist +"$PACKAGE"
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          # A boot-time Pixel Launcher ANR can otherwise cover instrumented touches.
          "$ADB" shell am force-stop com.google.android.apps.nexuslauncher
      - name: Test command authorization and database preservation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-results
          ADB="$ANDROID_HOME/platform-tools/adb"
          COMPONENT="$("$ADB" shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\/androidx.test.runner.AndroidJUnitRunner\).*/\1/p' | tr -d '\r')"
          test -n "$COMPONENT"
          args=()
          if [[ "${{ inputs.device }}" == android-tv ]]; then
            test "$("$ADB" shell pm has-feature android.software.leanback | tr -d '\r')" = true
            args=(-e class 'app.rawline.mobile.NovemberRegressionTest#restoredAutoSelectorBuildsWithItsTrackedProfiles')
          fi
          "$ADB" shell am instrument -w -r "${args[@]}" "$COMPONENT" | tee security-results/instrumentation.txt
          grep -E 'OK \([0-9]+ tests?\)' security-results/instrumentation.txt
          ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' security-results/instrumentation.txt
      - name: Preserve palette screenshots before the isolated VPN test clears app data
        run: |
          mkdir -p security-results
          ADB="$ANDROID_HOME/platform-tools/adb"
          PACKAGE=$("$ADB" shell pm list packages | sed -n 's/^package:\(app.rawline.mobile[^[:space:]]*\)/\1/p' | grep -v '\.test$' | tr -d '\r')
          "$ADB" shell run-as "$PACKAGE" ls files | tr -d '\r' | while read -r file; do
            case "$file" in core.log|core.log.prev|home-*.png) "$ADB" exec-out run-as "$PACKAGE" cat "files/$file" > "security-results/$file";; esac
          done
      - name: Short VPN and unauthorized command check
        if: inputs.device != 'android-tv'
        env:
          TEST_SYSTEM_TUN: ${{ inputs.system_tun }}
        run: |
          python3 scripts/test_smoke_vpn_network.py
          python3 scripts/smoke_vpn_short.py
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p security-results
          "$ANDROID_HOME/platform-tools/adb" logcat -d > security-results/logcat.txt
          PACKAGE=$("$ANDROID_HOME/platform-tools/adb" shell pm list packages | sed -n 's/^package:\(app.rawline.mobile[^[:space:]]*\)/\1/p' | grep -v '\.test$' | tr -d '\r')
          "$ANDROID_HOME/platform-tools/adb" shell run-as "$PACKAGE" ls files | tr -d '\r' | while read -r file; do
            case "$file" in core.log|core.log.prev|*.png) "$ANDROID_HOME/platform-tools/adb" exec-out run-as "$PACKAGE" cat "files/$file" > "security-results/$file";; esac
          done
          cp "$RUNNER_TEMP/emulator.log" security-results/
          if test -d ui-screenshots; then cp -r ui-screenshots security-results/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-security-results-api${{ matrix.api }}
          path: security-results/
